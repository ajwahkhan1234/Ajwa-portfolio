<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Ajwa Malik</title>
  <meta name="description" content="Get in touch with Ajwa Malik about a website, web app or SEO project." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff4f9a'/%3E%3C/svg%3E" />
</head>
<body data-page="contact">
  <main id="page">
    <section class="page-head wrap">
      <p class="mono label" data-reveal>Contact</p>
      <h1 class="page-title" data-split>Have a project in mind?</h1>
    </section>
    <section class="contact-body wrap">
      <form class="contact-form" id="contact-form" novalidate>
        <label><span class="mono">Name</span><input name="name" required autocomplete="name" /></label>
        <label><span class="mono">Email</span><input name="email" type="email" required autocomplete="email" /></label>
        <label><span class="mono">Project type</span>
          <select name="type"><option>Website</option><option>Web app</option><option>SEO</option><option>WordPress</option><option>Something else</option></select>
        </label>
        <label class="full"><span class="mono">Tell me about it</span><textarea name="message" rows="5" required></textarea></label>
        <button class="btn" type="submit" data-magnetic><span>Send message</span></button>
        <p class="form-note mono" aria-live="polite"></p>
      </form>
      <aside class="contact-aside" data-reveal>
        <p class="mono label">Email</p>
        <a class="big-link" data-email></a>
        <p class="mono label">Local time</p>
        <p class="clock" data-clock></p>
      </aside>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
