<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Ajwa Malik</title>
  <meta name="description" content="Every project by Ajwa Malik: SEO case studies with Search Console results, websites, web apps, WordPress plugins, branding and tools." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff4f9a'/%3E%3C/svg%3E" />

<body data-page="projects">
  <main id="page">
    <section class="page-head wrap">
      <p class="mono label" data-reveal>Index</p>
      <h1 class="page-title" data-split>Projects</h1>
      <div class="view-toggle mono" data-reveal>
        <button class="is-active" data-view="list">List</button>
        <button data-view="grid">Grid</button>
      </div>
    </section>
    <section class="wrap">
      <div class="project-filters mono" id="project-filters" role="toolbar" aria-label="Filter projects" data-reveal></div>
      <ul class="project-list" id="project-list"></ul>
      <div class="card-grid is-hidden" id="project-grid"></div>
    </section>
    <div class="hover-preview" aria-hidden="true"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
